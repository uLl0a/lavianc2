version: "3.9"
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: rtc2
      POSTGRES_PASSWORD: rtc2
      POSTGRES_DB: rtc2
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./migrations:/docker-entrypoint-initdb.d
volumes:
  pgdata: